<div class="space-y-2">
  @for (provider of providers(); track provider) {
    <button
      type="button"
      (click)="onLogin(provider)"
      [disabled]="disabled() || !!activeProvider()"
      class="w-full py-2.5 px-4 bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 rounded-md text-xs font-semibold flex items-center justify-center transition shadow-sm cursor-pointer disabled:opacity-50 select-none"
    >
      @if (activeProvider() === provider) {
        <span>Connecting to {{ allProviders[provider]?.name }}...</span>
      } @else {
        <span>Continue with {{ allProviders[provider]?.name }}</span>
      }
    </button>
  }
</div>

@if (dividerText()) {
  <div class="relative flex items-center justify-center my-4">
    <div class="w-full border-t border-slate-200"></div>
    <span class="absolute bg-white px-3 text-[11px] font-medium uppercase text-slate-400">
      {{ dividerText() }}
    </span>
  </div>
}
