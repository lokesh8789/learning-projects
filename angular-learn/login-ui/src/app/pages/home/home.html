<div class="min-h-screen bg-slate-50 p-6 flex items-center justify-center">
  <div class="w-full max-w-md bg-white p-8 rounded-xl border border-slate-200 shadow-sm space-y-6">
    <div class="flex items-center justify-between border-b border-slate-100 pb-4">
      <div>
        <h1 class="text-lg font-bold text-slate-900">Dashboard</h1>
        <p class="text-xs text-slate-500">Account overview</p>
      </div>
      <button
        (click)="logout()"
        class="px-3 py-1.5 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md transition cursor-pointer"
      >
        Sign out
      </button>
    </div>

    <div class="space-y-3">
      <div class="p-4 bg-slate-50 rounded-lg border border-slate-100 space-y-2.5">
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-500 font-medium text-xs">Name</span>
          <span class="text-slate-900 font-semibold text-sm">{{ user()?.name || 'Guest User' }}</span>
        </div>
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-500 font-medium text-xs">Email</span>
          <span class="text-slate-900 font-mono text-xs">{{ user()?.email || '—' }}</span>
        </div>
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-500 font-medium text-xs">Account ID</span>
          <span class="text-slate-600 text-xs font-mono">#{{ user()?.id || '—' }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
